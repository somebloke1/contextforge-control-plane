[mcp_servers.contextforge-helper]
command = "/home/dgk/workspace/cf-controlplane/.venv/bin/python"
args = ["/home/dgk/workspace/cf-controlplane/scripts/contextforge_helper_mcp.py"]

[hooks]

[[hooks.PreCompact]]
matcher = "manual|auto"

[[hooks.PreCompact.hooks]]
type = "command"
command = '/usr/bin/env python3 "$(git rev-parse --show-toplevel)/.codex/hooks/contextforge_precompact_continuity.py"'
timeout = 10
statusMessage = "Preserving ContextForge continuity"
suppressOutput = true

[[hooks.SessionStart]]
matcher = "compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = '/usr/bin/env python3 "$(git rev-parse --show-toplevel)/.codex/hooks/contextforge_precompact_continuity.py"'
timeout = 10
statusMessage = "Restoring ContextForge continuity"
suppressOutput = true

# contextforge-project-init-owner = "ContextForge"
# contextforge-project-init-service-binding = "context7:canonical"
# contextforge-project-init-virtual-server = "context7_local_server"
[mcp_servers.context7]
command = "/home/dgk/workspace/cf-controlplane/.venv/bin/python"
args = ["/home/dgk/workspace/cf-controlplane/scripts/contextforge_mcp_wrapper.py", "context7_local_server"]
cwd = "/home/dgk/workspace/cf-controlplane"
env = { CONTEXTFORGE_WRAPPER_IDLE_TIMEOUT_SECONDS = "300", MCP_WRAPPER_LOG_LEVEL = "INFO" }
startup_timeout_ms = 60000
tool_timeout_ms = 120000

