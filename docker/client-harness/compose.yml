name: contextforge-client-harness

x-client-common: &client-common
  tty: false
  stdin_open: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./workspace:/workspace
    - ./evidence:/evidence

x-opencode-contextforge-baseline: &opencode-contextforge-baseline
  <<: *client-common
  image: contextforge-client-opencode:${OPENCODE_VERSION:-latest}
  build:
    context: ./opencode
    args:
      BASE_IMAGE: contextforge-client-base:bookworm
      MCP_CONTEXTFORGE_GATEWAY_VERSION: "${MCP_CONTEXTFORGE_GATEWAY_VERSION:-1.0.3}"
      OPENCODE_VERSION: "${OPENCODE_VERSION:-latest}"
  env_file:
    - ./env/local-llama.env
  environment:
    OPENAI_API_KEY: "${LOCAL_LLAMA_KEY:-}"
    LOCAL_LLAMA_KEY: "${LOCAL_LLAMA_KEY:-}"
    OPENCODE_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
    LOCAL_LLAMA_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
    OPENCODE_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
    LOCAL_LLAMA_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
    OPENCODE_CONFIG: /home/agent/.config/opencode/opencode.json
    CONTEXTFORGE_OPENCODE_CONFIG_SOURCE: /config/opencode/opencode.json
    CONTEXTFORGE_OPENCODE_CONFIG_TARGET: /home/agent/.config/opencode/opencode.json
    CONTEXTFORGE_OPENCODE_PLUGIN_SOURCE: /config/opencode/plugins/contextforge-project-init.js
    CONTEXTFORGE_OPENCODE_PLUGIN_TARGET: /home/agent/.config/opencode/plugins/contextforge-project-init.js
    CONTEXTFORGE_OPENCODE_HOOK: /repo/scripts/opencode_project_init_hook.py
    CONTEXTFORGE_OPENCODE_HOOK_PYTHON: /opt/contextforge-helper-venv/bin/python
    CONTEXTFORGE_OPENCODE_WRAPPER_PYTHON: /opt/contextforge-helper-venv/bin/python
    CONTEXTFORGE_OPENCODE_WRAPPER_SCRIPT: /repo/scripts/contextforge_mcp_wrapper.py
    CONTEXTFORGE_OPENCODE_WRAPPER_CONFIG_ENV: /config/contextforge/contextforge.env
    CONTEXTFORGE_OPENCODE_WRAPPER_BASE_URL: http://host.docker.internal:4445
    CONTEXTFORGE_OPENCODE_WRAPPER_TOKEN_CACHE: /tmp/contextforge-wrapper-token.local.json
    CONTEXTFORGE_PROJECT_INIT_RUN_ROOT: /home/agent/.local/state/contextforge-client-harness-runtime/project-init
    CONTEXTFORGE_HELPER_PYTHON: /opt/contextforge-helper-venv/bin/python
    CONTEXTFORGE_HELPER_SCRIPT: /repo/scripts/contextforge_helper_mcp.py
    CONTEXTFORGE_ADDITIONAL_SAFE_PROJECT_ROOTS: /workspace

x-pi-contextforge-baseline: &pi-contextforge-baseline
  <<: *client-common
  image: contextforge-client-pi:${PI_CODING_AGENT_VERSION:-latest}
  build:
    context: ./pi
    args:
      BASE_IMAGE: contextforge-client-base:bookworm
      MCP_CONTEXTFORGE_GATEWAY_VERSION: "${MCP_CONTEXTFORGE_GATEWAY_VERSION:-1.0.3}"
      PI_CODING_AGENT_VERSION: "${PI_CODING_AGENT_VERSION:-latest}"
  env_file:
    - ./env/local-llama.env
  environment:
    LOCAL_LLAMA_KEY: "${LOCAL_LLAMA_KEY:-}"
    LOCAL_LLAMA_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
    LOCAL_LLAMA_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
    PI_CODING_AGENT_DIR: /home/agent/.pi/agent
    CONTEXTFORGE_PI_SHIM_EXTENSION: /repo/pi-extensions/contextforge-global-shim/index.ts
    CONTEXTFORGE_PI_SHIM_INSTALL_DIR: /home/agent/.pi/agent/extensions/contextforge-global-shim
    CONTEXTFORGE_PI_SHIM_PORTAL_ROOT: /repo
    CONTEXTFORGE_PI_SHIM_WORKSPACE_ROOT: /workspace
    CONTEXTFORGE_PI_SHIM_PYTHON: /opt/contextforge-wrapper-venv/bin/python
    CONTEXTFORGE_PI_SHIM_WRAPPER: /repo/scripts/contextforge_mcp_wrapper.py
    CONTEXTFORGE_CONFIG_ENV: /config/contextforge/contextforge.env
    CONTEXTFORGE_BASE_URL: http://host.docker.internal:4445
    CONTEXTFORGE_TOKEN_CACHE: /tmp/contextforge-wrapper-token.local.json
    CONTEXTFORGE_TOKEN_LOCK: /tmp/contextforge-wrapper-token.local.json.lock
    CONTEXTFORGE_ADDITIONAL_SAFE_PROJECT_ROOTS: /workspace

services:
  base:
    image: contextforge-client-base:bookworm
    build:
      context: ./base
      args:
        NODE_MAJOR: "${NODE_MAJOR:-24}"
    profiles: ["build-only"]

  codex-cli:
    <<: *client-common
    image: contextforge-client-codex-cli:${CODEX_CLI_VERSION:-latest}
    build:
      context: ./codex-cli
      args:
        BASE_IMAGE: contextforge-client-base:bookworm
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-latest}"
    volumes:
      - codex-cli-home:/home/agent
      - ./workspace:/workspace
      - ./evidence:/evidence

  codex-cli-authenticated:
    <<: *client-common
    image: contextforge-client-codex-cli:authenticated

  claude-code:
    <<: *client-common
    image: contextforge-client-claude-code:${CLAUDE_CODE_VERSION:-latest}
    build:
      context: ./claude-code
      args:
        BASE_IMAGE: contextforge-client-base:bookworm
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-latest}"
    volumes:
      - claude-code-home:/home/agent
      - ./workspace:/workspace
      - ./evidence:/evidence

  gemini-cli:
    <<: *client-common
    image: contextforge-client-gemini-cli:${GEMINI_CLI_VERSION:-latest}
    build:
      context: ./gemini-cli
      args:
        BASE_IMAGE: contextforge-client-base:bookworm
        GEMINI_CLI_VERSION: "${GEMINI_CLI_VERSION:-latest}"
    environment:
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-main-sunset-499523-m6}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-us-central1}"
      GOOGLE_GENAI_USE_VERTEXAI: "${GOOGLE_GENAI_USE_VERTEXAI:-true}"
    volumes:
      - gemini-cli-home:/home/agent
      - ./workspace:/workspace
      - ./evidence:/evidence

  gemini-cli-authenticated:
    <<: *client-common
    image: contextforge-client-gemini-cli:authenticated
    environment:
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-main-sunset-499523-m6}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-us-central1}"
      GOOGLE_GENAI_USE_VERTEXAI: "${GOOGLE_GENAI_USE_VERTEXAI:-true}"

  opencode:
    <<: *opencode-contextforge-baseline
    volumes:
      - opencode-home:/home/agent
      - ../..:/repo:ro
      - ./config/opencode:/config/opencode:ro
      - ../contextforge-harness/env:/config/contextforge:ro
      - ./workspace:/workspace
      - ./evidence:/evidence

  opencode-ephemeral:
    <<: *opencode-contextforge-baseline
    volumes:
      - opencode-home:/home/agent
      - ../..:/repo:ro
      - ./config/opencode:/config/opencode:ro
      - ../contextforge-harness/env:/config/contextforge:ro
      - ./evidence:/evidence
    tmpfs:
      - /workspace:uid=1000,gid=1000,mode=0755

  opencode-alpine:
    <<: *client-common
    image: contextforge-client-opencode-alpine:${OPENCODE_VERSION:-latest}
    build:
      context: ./opencode-alpine
      args:
        OPENCODE_VERSION: "${OPENCODE_VERSION:-latest}"
    env_file:
      - ./env/local-llama.env
    environment:
      OPENAI_API_KEY: "${LOCAL_LLAMA_KEY:-}"
      LOCAL_LLAMA_KEY: "${LOCAL_LLAMA_KEY:-}"
      OPENCODE_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
      LOCAL_LLAMA_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
      OPENCODE_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
      LOCAL_LLAMA_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
      OPENCODE_CONFIG: /config/opencode/opencode.json
    volumes:
      - opencode-alpine-home:/home/agent
      - ./config/opencode:/config/opencode:ro
      - ./workspace:/workspace
      - ./evidence:/evidence

  pi:
    <<: *pi-contextforge-baseline
    volumes:
      - pi-home:/home/agent
      - ../..:/repo:ro
      - ./config/pi:/config/pi:ro
      - ../contextforge-harness/env:/config/contextforge:ro
      - ./workspace:/workspace
      - ./evidence:/evidence

  pi-ephemeral:
    <<: *pi-contextforge-baseline
    volumes:
      - pi-home:/home/agent
      - ../..:/repo:ro
      - ./config/pi:/config/pi:ro
      - ../contextforge-harness/env:/config/contextforge:ro
      - ./evidence:/evidence
    tmpfs:
      - /workspace:uid=1000,gid=1000,mode=0755

  pi-alpine:
    <<: *client-common
    image: contextforge-client-pi-alpine:${PI_CODING_AGENT_VERSION:-latest}
    build:
      context: ./pi-alpine
      args:
        PI_CODING_AGENT_VERSION: "${PI_CODING_AGENT_VERSION:-latest}"
    env_file:
      - ./env/local-llama.env
    environment:
      LOCAL_LLAMA_KEY: "${LOCAL_LLAMA_KEY:-}"
      LOCAL_LLAMA_BASE_URL: "${LOCAL_LLAMA_BASE_URL:-http://host.docker.internal:8742/v1}"
      LOCAL_LLAMA_MODEL: "${LOCAL_LLAMA_MODEL:-qwen3.6-a3b}"
      PI_CODING_AGENT_DIR: /home/agent/.pi/agent
    volumes:
      - pi-alpine-home:/home/agent
      - ./config/pi:/config/pi:ro
      - ./workspace:/workspace
      - ./evidence:/evidence

volumes:
  codex-cli-home:
  claude-code-home:
  gemini-cli-home:
  opencode-home:
  opencode-alpine-home:
  pi-home:
  pi-alpine-home:
