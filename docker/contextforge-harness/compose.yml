name: contextforge-harness

services:
  contextforge-gateway:
    image: ghcr.io/ibm/mcp-context-forge:v1.0.3
    env_file:
      - ./env/contextforge.env
    ports:
      - "0.0.0.0:4445:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - contextforge-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4444/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mentality-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/mcp-transceiver/Dockerfile
      args:
        MCP_CONTEXTFORGE_GATEWAY_VERSION: "1.0.3"
    image: contextforge-harness-mentality-transceiver:latest
    ports:
      - "127.0.0.1:9201:9201"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9201/sse', timeout=5).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  context7-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/context7-transceiver/Dockerfile
      args:
        MCP_CONTEXTFORGE_GATEWAY_VERSION: "1.0.3"
    image: contextforge-harness-context7-transceiver:latest
    environment:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
    ports:
      - "127.0.0.1:9203:9203"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9203/sse', timeout=5).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  exa-search-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/exa-search-transceiver/Dockerfile
      args:
        MCP_CONTEXTFORGE_GATEWAY_VERSION: "1.0.3"
    image: contextforge-harness-exa-search-transceiver:latest
    env_file:
      - path: ../../server-instances/exa-search/.env
        required: false
    ports:
      - "127.0.0.1:9205:9205"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9205/sse', timeout=5).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  playwright-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/playwright-transceiver/Dockerfile
    image: contextforge-harness-playwright-transceiver:latest
    ports:
      - "127.0.0.1:9204:9204"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9204/sse').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  contextforge-data:
