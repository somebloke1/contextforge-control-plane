name: contextforge-harness

services:
  contextforge-gateway:
    image: ghcr.io/ibm/mcp-context-forge:v1.0.3
    env_file:
      - ./env/contextforge.env
    ports:
      - "0.0.0.0:4445:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - contextforge-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4444/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mentality-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/mcp-transceiver/Dockerfile
      args:
        MCP_CONTEXTFORGE_GATEWAY_VERSION: "1.0.3"
    image: contextforge-harness-mentality-transceiver:latest
    ports:
      - "127.0.0.1:9201:9201"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9201/sse', timeout=5).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  context7-transceiver:
    build:
      context: ../..
      dockerfile: docker/contextforge-harness/context7-transceiver/Dockerfile
      args:
        MCP_CONTEXTFORGE_GATEWAY_VERSION: "1.0.3"
    image: contextforge-harness-context7-transceiver:latest
    environment:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
    ports:
      - "127.0.0.1:9203:9203"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9203/sse', timeout=5).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  contextforge-data:
